plugins { id 'com.android.application' }

android {
    namespace 'com.js.nowakelock.probe'
    compileSdk 37
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'com.js.nowakelock.probe'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
